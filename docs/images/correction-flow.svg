<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>单句微调和锚点重算的区别</title><rect width="1200" height="600" rx="24" fill="#102d3a"/><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#e8f3f7}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#b4d1dc}.label{font-size:21px;font-weight:700}.body{font-size:18px}</style><text x="42" y="62" class="title">调整一处，还是重算后续？</text><text x="42" y="99" class="sub">虚构时间示例 · 两条路线都会保留可回退的版本。</text><rect x="42" y="140" width="540" height="350" rx="16" fill="#1a4354" stroke="#397386"/><text x="65" y="183" class="label">只改这一句</text><text x="65" y="231" class="body">起点 12.3 s → 12.6 s</text><text x="65" y="273" class="body">终点 15.8 s → 16.0 s</text><text x="65" y="315" class="body">↓</text><text x="65" y="357" class="body">句内字词按原相对位置缩放</text><text x="65" y="399" class="body">↓</text><text x="65" y="441" class="body">应用并重新渲染（无需重新声学对齐）</text><rect x="612" y="140" width="546" height="350" rx="16" fill="#1a4354" stroke="#397386"/><text x="635" y="183" class="label">从确认的锚点重算</text><text x="635" y="231" class="body">选定已经试听确认的句子</text><text x="635" y="273" class="body">锚点句及之前的修改应用并锁定</text><text x="635" y="315" class="body">↓</text><text x="635" y="357" class="body">从锚点句末重新分析后续音频</text><text x="635" y="399" class="body">↓</text><text x="635" y="441" class="body">后续待提交偏移由新对齐替代</text><text x="42" y="540" class="sub">修改输入框 ≠ 播放器已更新；必须提交生成新版本，再试听确认。</text></svg>