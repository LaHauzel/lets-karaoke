<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>从安装到第一段成片的路线图</title><rect width="1200" height="600" rx="24" fill="#102d3a"/><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#e8f3f7}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#b4d1dc}.label{font-size:21px;font-weight:700}.body{font-size:18px}</style><text x="42" y="63" class="title">从安装到第一段成片</text><text x="42" y="99" class="sub">按用途安装依赖；安装与启动都使用系统默认 Python。</text><rect x="42" y="145" width="336" height="235" rx="16" fill="#1a4354" stroke="#397386"/><text x="64" y="183" class="sub">01</text><text x="64" y="220" class="label">基础工具</text><text x="64" y="262" class="body">Python 3.11 64 位</text><text x="64" y="295" class="body">FFmpeg + FFprobe</text><text x="64" y="328" class="body">GPU 路线：NVIDIA 驱动</text><rect x="432" y="145" width="336" height="235" rx="16" fill="#1a4354" stroke="#397386"/><text x="454" y="183" class="sub">02</text><text x="454" y="220" class="label">选择安装组合</text><text x="454" y="262" class="body">已有歌词 → Whisper</text><text x="454" y="295" class="body">没有歌词 → Qwen</text><text x="454" y="328" class="body">只切视频 → 切割最小环境</text><rect x="822" y="145" width="336" height="235" rx="16" fill="#1a4354" stroke="#397386"/><text x="844" y="183" class="sub">03</text><text x="844" y="220" class="label">启动与输出</text><text x="844" y="262" class="body">按需下载模型</text><text x="844" y="295" class="body">webui.bat → 浏览器</text><text x="844" y="328" class="body">导入 → 生成 → 复核</text><text x="389" y="270" class="title">→</text><text x="779" y="270" class="title">→</text><rect x="42" y="417" width="1116" height="139" rx="16" fill="#1a4354" stroke="#397386"/><text x="65" y="454" class="label">第一次推荐</text><text x="65" y="491" class="body">安装助手 [1] Whisper → [6] 下载模型 → 环境检查 → webui.bat</text><text x="65" y="530" class="sub">只切割视频：选 [2]，无需下载模型。高级参数先保持默认。</text></svg>