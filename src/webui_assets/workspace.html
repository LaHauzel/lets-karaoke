<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>lets-karaoke · 本地影音工作台</title>
<link rel="stylesheet" href="/theme.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--lk-bg);font-size:14px}
.workspace-header{display:flex;align-items:center;gap:28px;min-height:76px;padding:14px 28px;border-bottom:1px solid var(--lk-border);background:#101a21;box-shadow:0 4px 22px #00000016}
.workspace-brand{display:flex;gap:11px;align-items:center;flex:none}
.brand-mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid #63dbc533;background:#63dbc510;border-radius:11px;color:var(--lk-accent)}
.brand-mark svg{width:23px;height:23px}
.brand-name{font-size:17px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.brand-caption{display:block;color:var(--lk-muted);font-size:10px;letter-spacing:.08em;margin-top:4px}
.workspace-nav{display:flex;align-items:center;gap:5px;border:1px solid var(--lk-border);padding:4px;border-radius:12px;background:var(--lk-bg)}
.workspace-nav button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 15px;color:var(--lk-muted);background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap;transition:background .15s,color .15s}
.workspace-nav button svg{width:15px;height:15px;flex:none}
.workspace-nav button:hover{color:var(--lk-text);background:#23343d}
.workspace-nav button[aria-selected=true]{color:var(--lk-accent);background:#163931;border-color:#326558}
.workspace-nav button:focus-visible{outline-offset:2px}
.workspace-status{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto;flex:none}
.local-status{display:flex;align-items:center;gap:7px;color:#bed7d3;font-size:11px}
.workspace-status small{font-size:10px;color:var(--lk-muted)}
.workspace-panels{min-height:0;height:100%;overflow:hidden}
iframe{width:100%;height:100%;border:0;display:block;background:var(--lk-bg)}
iframe:focus-visible{outline-offset:-2px}
.skip-link{position:absolute;z-index:5;top:-100px;left:20px;background:var(--lk-accent);color:var(--lk-accent-text);border-radius:8px;padding:9px 14px}
.skip-link:focus{top:8px}
@media(max-width:760px){.workspace-header{gap:16px;padding:12px 16px}.workspace-status small{display:none}.brand-caption{display:none}.workspace-nav button{padding:7px 10px}.brand-name{font-size:15px}}
@media(max-width:560px){.workspace-header{display:grid;grid-template-columns:1fr auto;gap:11px;min-height:0;padding:12px 14px}.workspace-nav{grid-column:1/-1;grid-row:2;justify-self:stretch}.workspace-nav button{flex:1;min-height:38px;font-size:13px}.workspace-status{grid-column:2;grid-row:1}.brand-mark{width:30px;height:30px;border-radius:9px}.local-status{font-size:10px}}
</style></head><body>
<a class="skip-link" href="#panel-karaoke" id="skip-workspace">跳到工作区</a>
<header class="workspace-header">
<div class="workspace-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4m4-7v10m4-14v18m4-14v10m4-7v4"/></svg></span><div><strong class="brand-name">lets-karaoke</strong><span class="brand-caption">本地音乐制作工作台</span></div></div>
<nav class="workspace-nav" role="tablist" aria-label="工作台功能"><button id="tab-karaoke" role="tab" aria-selected="true" aria-controls="panel-karaoke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h7"/></svg>卡拉OK 字幕</button><button id="tab-concert" role="tab" aria-selected="false" aria-controls="panel-concert" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m8 8 10 10M8 16l10-10"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg>演唱会切割</button></nav>
<div class="workspace-status"><span class="local-status"><span class="lk-dot" aria-hidden="true"></span>本地处理</span><small>可选歌词检索</small></div>
</header>
<main class="workspace-panels" aria-label="当前工作区">
<iframe id="panel-karaoke" role="tabpanel" aria-labelledby="tab-karaoke" title="卡拉OK 字幕工坊" src="/karaoke" tabindex="0"></iframe>
<iframe id="panel-concert" role="tabpanel" aria-labelledby="tab-concert" title="演唱会切割" tabindex="0" hidden></iframe>
</main>
<script>
function selectTab(name){for(const n of ['karaoke','concert']){const on=n===name,b=document.getElementById('tab-'+n),p=document.getElementById('panel-'+n);b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;p.hidden=!on;if(on&&!p.getAttribute('src'))p.src='/'+n;}document.getElementById('skip-workspace').href='#panel-'+name;history.replaceState(null,'','#'+name);}
const workspaceSkipLink=document.getElementById('skip-workspace');
workspaceSkipLink.onclick=event=>{event.preventDefault();document.getElementById(workspaceSkipLink.hash.slice(1))?.focus();};
for(const n of ['karaoke','concert']){const b=document.getElementById('tab-'+n);b.onclick=()=>selectTab(n);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const target=e.key==='Home'?'karaoke':e.key==='End'?'concert':n==='karaoke'?'concert':'karaoke';selectTab(target);document.getElementById('tab-'+target).focus();}};}
const karaokeFrame=document.getElementById('panel-karaoke'),concertFrame=document.getElementById('panel-concert');
let karaokeReady=false,pendingImport=null;
function dispatchImport(){
  if(!pendingImport)return;
  if(!karaokeReady){karaokeFrame.contentWindow?.postMessage({type:'lets-karaoke:ping'},location.origin);return;}
  karaokeFrame.contentWindow.postMessage(pendingImport,location.origin);
  pendingImport=null;
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  if(event.source===karaokeFrame.contentWindow&&event.data?.type==='lets-karaoke:ready'){
    karaokeReady=true;dispatchImport();return;
  }
  if(event.source!==concertFrame.contentWindow||event.data?.type!=='lets-karaoke:import-concert-media')return;
  const url=new URL(event.data.url||'',location.origin);
  if(url.origin!==location.origin||!/^\/concert-files\/[a-zA-Z0-9_-]+\/export-[a-f0-9]+\/[^/]+$/.test(url.pathname))return;
  pendingImport={type:'lets-karaoke:import-concert-media',url:url.pathname,name:String(event.data.name||'').slice(0,180),size:Number(event.data.size)||0};
  selectTab('karaoke');dispatchImport();
});
karaokeFrame.addEventListener('load',()=>{karaokeReady=false;karaokeFrame.contentWindow.postMessage({type:'lets-karaoke:ping'},location.origin);});
selectTab(location.hash==='#concert'?'concert':'karaoke');
</script></body></html>
